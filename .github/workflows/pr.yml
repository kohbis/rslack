---
name: PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run fmt check
        run: >
          cargo fmt --
          --check

      - name: Run clippy
        run: >
          cargo clippy
          --all-targets
          -- -D warnings

      - name: Run tests
        run: >
          cargo test
