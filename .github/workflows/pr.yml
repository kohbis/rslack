---
name: PR

on:
  pull_request:
  workflow_dispatch:

jobs:
  actions-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Verify actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify

  spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run fmt check
        run: >
          cargo fmt --
          --check

      - name: Run clippy
        run: >
          cargo clippy
          --all-targets
          -- -D warnings

      - name: Run tests
        run: >
          cargo test
